name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Start fresh quality evidence for this checkout
        run: python3 infra/prepare_ci_evidence.py --job quality
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare checksummed data and reproduce evaluation
        run: make data PYTHON=python
      - name: Inventory observed data licenses without automatic legal clearance
        run: make audit-licenses PYTHON=python
      - name: Benchmark exact global binding-deletion audits on all diseases
        run: make benchmark-audits PYTHON=python
      - name: Export and verify complete frozen research edition
        run: make snapshot PYTHON=python
      - name: Compare every score with the checksum-verified v1.0 implementation
        run: make verify-scores PYTHON=python
      - name: Lint and formatting
        run: make lint PYTHON=python
      - name: Unit, API and browser-module tests
        run: make test PYTHON=python
      - name: Execute notebook
        run: make notebook PYTHON=python
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          if-no-files-found: warn
          path: |
            reports/ci-quality.json
            reports/v1.1.0/score-regression.json
            reports/v1.1.0/assessment-nicotine-interacts.json
            reports/v1.1.0/assessment-galantamine-interacts.json
            reports/v1.2.0/license-inventory.json
            reports/v1.2.0/binding-audit-benchmark.json
            reports/v1.2.0/binding-audit-summary.json
            reports/v1.2.0/binding-audit-example-competitor.json
            reports/v1.2.0/binding-audit-example-greedy.json
            reports/v1.2.0/binding-audit-example-strong-greedy.json
            reports/v1.2.0/binding-audit-example-scope.json
            coverage.xml
            reports/junit.xml
            data/processed/evaluation.json
            data/processed/model.json
            data/processed/manifest.json
            demo.executed.ipynb

  integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start fresh integration evidence for this checkout
        run: python3 infra/prepare_ci_evidence.py --job integration
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Reserve disk for the pinned Ollama image and model
        run: |
          mkdir -p reports
          df -h > reports/runner-resources.txt
          free -h >> reports/runner-resources.txt
          sudo rm -rf /usr/local/lib/android
          df -h >> reports/runner-resources.txt
          free -h >> reports/runner-resources.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start the complete Compose stack including the local language model
        run: make docker-run
      - name: Verify the recorded reference-model identity
        run: |
          python - <<'PYMODEL'
          import json
          from infra.bootstrap_model import DEFAULT_MODEL, DEFAULT_MODEL_DIGEST
          with open("reports/ollama-model.json", encoding="utf-8") as source:
              report = json.load(source)
          assert report["status"] == "verified", report
          assert report["requested_model"] == DEFAULT_MODEL, report
          assert report["digest"] == DEFAULT_MODEL_DIGEST, report
          PYMODEL
      - name: Verify HTTP workflow, exact audit replay, tamper rejection and agent guard
        run: make smoke PYTHON=python
      - name: Verify real Cypher, idempotent import and GDS algorithms
        run: |
          set -a
          . ./.env
          set +a
          export NEO4J_URI=bolt://localhost:7687
          export ARIADNE_GRAPH_BACKEND=neo4j
          make data PYTHON=python
          make test-integration PYTHON=python
      - name: Verify real LLM investigation, evidence challenge and rejection
        run: make test-llm PYTHON=python
      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p reports
          docker compose --profile llm logs --no-color > reports/container-logs.txt
          docker compose --profile llm ps --format json > reports/container-status.json
          docker system df > reports/docker-disk-usage.txt
          df -h >> reports/runner-resources.txt
          free -h >> reports/runner-resources.txt
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-evidence
          path: |
            reports/ci-integration.json
            reports/http_smoke.json
            reports/ollama-model.json
            reports/neo4j-junit.xml
            reports/container-status.json
            reports/container-logs.txt
            reports/runner-resources.txt
            reports/docker-disk-usage.txt
            reports/llm-junit.xml
            reports/llm-investigate.json
            reports/llm-challenge.json
            reports/llm-reject.json
            reports/llm-compound.json
      - name: Stop services
        if: always()
        run: docker compose --profile llm down --volumes

  publish:
    needs: [quality, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ariadne-bio-api
            dockerfile: Dockerfile
          - image: ariadne-bio-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/azzbee/${{ matrix.image }}:latest
            ghcr.io/azzbee/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
