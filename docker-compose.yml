name: ariadne

services:
  neo4j:
    build:
      context: .
      dockerfile: infra/neo4j.Dockerfile
    image: ariadne-neo4j:5.26.0-gds2.13.4
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run make init to generate local credentials}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN gds.version()' >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/azzbee/ariadne-bio-api:latest
    restart: unless-stopped
    environment:
      ARIADNE_GRAPH_BACKEND: neo4j
      ARIADNE_DATA_DIR: /app/data/processed
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run make init}
      NEO4J_DATABASE: neo4j
      ARIADNE_AGENT_MODE: ${ARIADNE_AGENT_MODE:-auto}
      ARIADNE_LLM_BASE_URL: ${ARIADNE_LLM_BASE_URL:-http://ollama:11434/v1}
      ARIADNE_LLM_MODEL: ${ARIADNE_LLM_MODEL:-qwen2.5:1.5b}
      ARIADNE_LLM_API_KEY: ${ARIADNE_LLM_API_KEY:-}
      ARIADNE_LLM_TIMEOUT: ${ARIADNE_LLM_TIMEOUT:-120}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ariadne_data:/app/data
      - ariadne_reports:/app/reports

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/azzbee/ariadne-bio-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    profiles: [llm]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  ollama-init:
    image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
    profiles: [llm]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      ARIADNE_LLM_MODEL: ${ARIADNE_LLM_MODEL:-qwen2.5:1.5b}
      ARIADNE_LLM_MODEL_DIGEST: ${ARIADNE_LLM_MODEL_DIGEST:-}
    volumes:
      - ./infra/bootstrap_model.py:/opt/ariadne/bootstrap_model.py:ro
    entrypoint: ["python", "/opt/ariadne/bootstrap_model.py"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  ariadne_data:
  ariadne_reports:
  ollama_models:
