<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="title desc">
<title id="title">ARIADNE service architecture and data flow</title>
<desc id="desc">The browser uses Nginx on port 8080 and FastAPI on 8000. FastAPI orchestrates read-only graph tools, fixed-model ranking and three audit engines. Neo4j with GDS uses Bolt 7687 and Browser 7474. An optional Ollama service on internal port 11434 or configured provider supplies validated plans, never scores. Checksummed Hetionet data is prepared with treatment labels separate, imported idempotently and fitted using a recorded split. Graph and saved model are fixed during challenges.</desc>
