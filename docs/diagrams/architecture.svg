<text x="416" y="794" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">Idempotent graph import</text>
<path d="M 964 872 L 981 872 L 981 460 L 785 460" fill="none" stroke="#506862" stroke-width="2" marker-end="url(#arrow)"/>
