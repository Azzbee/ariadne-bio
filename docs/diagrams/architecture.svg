<text x="880" y="438" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">Load fixed artifacts</text>
<text x="36" y="973" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Labels supervise fitting and evaluation; TREATS / PALLIATES never enter predictive evidence paths.</text>
<text x="36" y="1003" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Binding, provenance and joint auditors return replayable certificates bound to the graph and model.</text>
<text x="36" y="1033" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Published ports bind to 127.0.0.1. Core-only startup uses deterministic planning by default.</text>
