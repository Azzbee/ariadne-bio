<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
<title id="title">ARIADNE biological evidence schema</title>
<desc id="desc">Compound binds Gene; Disease associates with Gene; Genes interact and participate in Pathway. Gene A and Gene B are roles of the same label. All biological nodes share Entity identity. Treatment labels are separate from the graph used for predictive features.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#506862"/></marker></defs>
<rect width="1000" height="880" rx="16" fill="#faf9f5"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="36" y="45" font-size="14" font-weight="700" fill="#506862" text-anchor="start">THE BIOLOGICAL EVIDENCE GRAPH</text>
<text x="36" y="82" font-size="28" font-weight="650" fill="#153f39" text-anchor="start">Four entity types. Four evidence families.</text>
<text x="36" y="111" font-size="16" font-weight="400" fill="#153f39" text-anchor="start">24,456 biological entities · 255,730 evidence records · Hetionet v1.0</text>
<rect x="60" y="150" width="310" height="112" rx="12" fill="#ffffff" stroke="#bdcec5" stroke-width="1.5"/>
<text x="80" y="184" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">Compound : Entity</text>
<text x="80" y="212" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Compound::DrugBank identifier</text>
<text x="80" y="235" font-size="15" font-weight="400" fill="#506862" text-anchor="start">1,552 compounds</text>
<rect x="630" y="150" width="310" height="112" rx="12" fill="#ffffff" stroke="#bdcec5" stroke-width="1.5"/>
<text x="650" y="184" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">Disease : Entity</text>
<text x="650" y="212" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Disease::DOID identifier</text>
<text x="650" y="235" font-size="15" font-weight="400" fill="#506862" text-anchor="start">137 diseases</text>
<rect x="60" y="345" width="310" height="112" rx="12" fill="#ffffff" stroke="#bdcec5" stroke-width="1.5"/>
<text x="80" y="379" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">Gene A : Entity</text>
<text x="80" y="407" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Gene::Entrez identifier</text>
<text x="80" y="430" font-size="15" font-weight="400" fill="#506862" text-anchor="start">20,945 genes across both roles</text>
<rect x="630" y="345" width="310" height="112" rx="12" fill="#ffffff" stroke="#bdcec5" stroke-width="1.5"/>
<text x="650" y="379" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">Gene B : Entity</text>
<text x="650" y="407" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Gene::Entrez identifier</text>
<text x="650" y="430" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Same Gene label as role A</text>
<rect x="345" y="545" width="310" height="112" rx="12" fill="#ffffff" stroke="#bdcec5" stroke-width="1.5"/>
<text x="365" y="579" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">Pathway : Entity</text>
<text x="365" y="607" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Pathway::source identifier</text>
<text x="365" y="630" font-size="15" font-weight="400" fill="#506862" text-anchor="start">1,822 pathways</text>
<path d="M 215 262 L 215 345" fill="none" stroke="#506862" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="133.0" y="284" width="164" height="23" rx="4" fill="#faf9f5"/>
<text x="215" y="301" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">BINDS · 11,571</text>
<path d="M 785 262 L 785 345" fill="none" stroke="#506862" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="681.5" y="284" width="207" height="23" rx="4" fill="#faf9f5"/>
<text x="785" y="301" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">ASSOCIATES · 12,623</text>
<path d="M 370 401 L 630 401" fill="none" stroke="#506862" stroke-width="2"/>
<rect x="397.0" y="371" width="206" height="23" rx="4" fill="#faf9f5"/>
<text x="500" y="388" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">INTERACTS · 147,164</text>
<text x="500" y="429" font-size="14" font-weight="400" fill="#506862" text-anchor="middle">symmetric traversal</text>
<path d="M 215 457 L 215 515 Q 215 540 240 560 L 345 601" fill="none" stroke="#506862" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 785 457 L 785 515 Q 785 540 760 560 L 655 601" fill="none" stroke="#506862" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="139.0" y="485" width="152" height="23" rx="4" fill="#faf9f5"/>
<text x="215" y="502" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">PARTICIPATES</text>
<rect x="709.0" y="485" width="152" height="23" rx="4" fill="#faf9f5"/>
<text x="785" y="502" font-size="15" font-weight="600" fill="#153f39" text-anchor="middle">PARTICIPATES</text>
<text x="500" y="524" font-size="15" font-weight="400" fill="#506862" text-anchor="middle">84,372 PARTICIPATES records in total</text>
<rect x="36" y="690" width="564" height="146" rx="12" fill="#ffffff" stroke="#bdcec5" stroke-width="1.5"/>
<text x="56" y="724" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">Identity and retained provenance</text>
<text x="56" y="752" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Nodes: id, identifier, name; available url and original data</text>
<text x="56" y="775" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Relations: id, type, direction, sources, license, data</text>
<text x="56" y="798" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Namespace-qualified IDs; original metadata is preserved.</text>
<rect x="624" y="690" width="340" height="146" rx="12" fill="#fff8e9" stroke="#986417" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="644" y="724" font-size="20" font-weight="650" fill="#153f39" text-anchor="start">755 treatment label pairs</text>
<text x="644" y="752" font-size="15" font-weight="400" fill="#506862" text-anchor="start">TREATS / PALLIATES held separately</text>
<text x="644" y="775" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Train / validation / test and lookup</text>
<text x="644" y="798" font-size="15" font-weight="400" fill="#506862" text-anchor="start">Excluded from predictive graph paths</text>
<text x="36" y="862" font-size="14" font-weight="400" fill="#506862" text-anchor="start">Gene A/B are path roles. INTERACTS records retain original direction; traversal is symmetric.</text>
</g></svg>
